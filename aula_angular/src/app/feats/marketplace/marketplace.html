<div class="pagina-marketplace">

  <form class="formulario-produto" (submit)="cadastrarProduto($event)">

    <label>
      Nome do produto
      <input
        type="text"
        (input)="cardTrueOrFalse()"
        [formField]="produtoMarket.titulo">
    </label>

    <label>
      Descrição do produto
      <input
        type="text"
        [formField]="produtoMarket.descricao">
    </label>

    <label>
      Preço do produto
      <input
        type="number"
        inputmode="numeric"
        [formField]="produtoMarket.preco">
    </label>

    <button type="submit">
      Cadastrar Produto
    </button>

  </form>

  @if (card_criado() && tudoIncerido()) {
    <div class="produto">
      <h2 id="titulo">
        <strong>{{ produtoCadastrado()?.titulo }}</strong>
      </h2>

      <h3 id="descricao">
        {{ produtoCadastrado()?.descricao }}
      </h3>

      <h1 id="preco">
        R$
        {{ produtoCadastrado()?.preco }} 
      </h1>
    </div>
  }

</div>
<div>
</div>
