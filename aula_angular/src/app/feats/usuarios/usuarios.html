
<div class="formulario-cadastro">
  <input type="text" [(ngModel)]="novoNome" placeholder="Nome">
  <input type="number" [(ngModel)]="novoIdade" placeholder="Idade">
  <button (click)="adicionarUsuario()">Criar Card</button>
</div>

<div id="cards">
    @for (user of usuarios(); track user.id) {
        <div class="usuarios">
            <p class="idUsuario">id: {{user.id}}</p>
            <p class="nomeUsuario">nome: {{user.nome}}</p>
            <p class="idadeUsuario">idade: {{user.idade}}</p>
        </div>
    }
</div>
